  key_reverse: 追従カメラの向きを反転（前／後ろ）
  cheatsheet_title: フリーカメラ操作ガイド
  cheatsheet_contents: '# フリーカメラ操作ガイド

    この機能は**レース**または**ライブ**でのみ使用できます。


    初期設定の追従部位は**顔**です。


    初期設定の追従対象は**Place01**です。


    ## マウス操作

    * **右クリックを押しながらドラッグ:** 視点を動かす

    * **ホイールを上下:** 視野角を広げる／狭める


    ---


    ## ゲームパッド操作（Xbox／PlayStation）


    ### 移動と視点

    * **左スティック:** 左／右／前／後ろに移動

    * **右スティック:** 左／右／上／下を見る

    * **右トリガー（RT／R2）:** 上に移動

    * **左トリガー（LT／L2）:** 下に移動

    * **右ショルダー（RB／R1）:** 視野角を狭める

    * **左ショルダー（LB／L1）:** 視野角を広げる


    ---


    ### 操作ボタン

    * **Y**（△）: カメラ位置をリセット

    * **X**（□）: カメラモードを切り替え

    * **B**（○）: 追従カメラの向きを反転（キャラ追従時のみ）

    * **A**（×）: ライブを一時停止／再開


    ---


    ### 十字キー（自由移動モードでは使用不可）

    * **右:** 次の対象（キャラ追従／一人称視点）

    * **左:** 前の対象（キャラ追従／一人称視点）

    * **上:** 次の部位（キャラ追従時のみ）

    * **下:** 前の部位（キャラ追従時のみ）

    '
